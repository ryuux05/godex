services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: godex
      POSTGRES_PASSWORD: godex-example
      POSTGRES_DB: payments
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55442}:5432"
    volumes:
      - payments_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U godex -d payments"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  payments_data:
