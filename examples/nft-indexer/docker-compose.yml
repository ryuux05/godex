services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: godex
      POSTGRES_PASSWORD: godex-example
      POSTGRES_DB: nft
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55441}:5432"
    volumes:
      - nft_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U godex -d nft"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  nft_data:
